name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 🔴 Першим і окремо: інструмент виріс поруч із приватним дослідженням, і
  # ціна пропуску тут незворотна — git не забуває, а репозиторій публічний.
  private-data:
    name: приватні дані
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # потрібна gitleaks, що дивиться коміти
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: робоче дерево
        run: python tools/scan_private.py
      # 🔴 Історію тут НЕ скануємо, і це не послаблення. Приватна історія
      # розробки лишається приватною (рішення 21.09.2026: публікація йде з
      # чистого кореня, гілка `public`), тож `--history` на робочій гілці був
      # би червоний завжди — а ворота, які завжди червоні, вимикають, і тоді
      # вони не ловлять нічого. Історію стереже реліз, де ціна пропуску
      # незворотна: `release.yml` перевіряє історію ТЕГА.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Windows окремим рядком не для галочки: відчеплений наглядач стоїть
          # на `schtasks`, живість процесу — на psutil, і на Linux ці гілки
          # тести пропускають.
          - python: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: встановити
        # усі легкі extras: без fastapi тести дашборду не збираються, без
        # paramiko/boto3 — тести Vast і R2
        run: uv sync --locked --group dev --extra all
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: uv run pytest

  installable:
    name: ставиться з нуля
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pip install у чистий venv, без extras
        # 🔴 Саме без extras: ядро мусить запускатись і тоді, коли жодного SDK
        # бекенда не поставлено, а реєстр боксів порожній.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install .
          cd /tmp
          /tmp/clean/bin/gpurunner --version
          /tmp/clean/bin/gpurunner ls
          /tmp/clean/bin/gpurunner boxes ls
          /tmp/clean/bin/gpurunner run net-probe -b kaggle --dry-run --json | tail -n 1 \
            | /tmp/clean/bin/python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['schema']==1, d"
