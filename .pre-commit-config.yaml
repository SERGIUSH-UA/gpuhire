# Ворота перед комітом. Поставити: `uv run pre-commit install`.
repos:
  - repo: local
    hooks:
      # 🔴 Першим: перевіряє ІНДЕКС, тобто рівно те, що зараз закомітиться.
      - id: scan-private
        name: 🔒 приватні дані
        entry: python tools/scan_private.py --staged
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
